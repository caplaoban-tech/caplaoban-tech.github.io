name: Обновление рыночных данных

on:
  schedule:
    - cron: "0 1 * * 1-6"     # 09:00 Бали / 08:00 Джакарта: закрытия IDX, HK и A за вчера, LME за вчера (по просьбе Юрия)
    - cron: "20 10 * * 1-5"   # 17:20 Джакарта / 18:20 Бали, после закрытия IDX и публикации JISDOR
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-market
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Обновить данные
        run: python scripts/update_market.py
      - name: Сохранить изменения
        run: |
          if git diff --quiet; then echo "Без изменений"; exit 0; fi
          git config user.name "caplaoban-bot"
          git config user.email "caplaoban-tech@users.noreply.github.com"
          git add data
          git commit -m "Данные рынка: автообновление $(date -u +%Y-%m-%d)"
          git push
